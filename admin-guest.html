<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Givy Admin Panel</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
        }
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .login-box {
            background: #1a1f2e;
            padding: 2rem;
            border-radius: 20px;
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
            border: 1px solid #fbbf24;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0f1117;
            border: 1px solid #2d3748;
            color: white;
            border-radius: 10px;
        }
        .login-box button {
            background: #f59e0b;
            color: black;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        .error-msg {
            background: #991b1b;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1f2e;
            border-radius: 16px;
            overflow-x: auto;
            display: block;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2d3748;
        }
        th {
            background: #0f1117;
            color: #fbbf24;
        }
        .status-select {
            background: #0f1117;
            color: white;
            border: 1px solid #fbbf24;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
        }
        button.status-btn {
            background: #059669;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            margin: 2px;
        }
        button.status-btn.reject { background: #dc2626; }
        button.status-btn.confirm { background: #d97706; }
        .guest-badge {
            background: #2563eb;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            display: inline-block;
        }
        h1 { color: #fbbf24; text-align: center; margin-bottom: 20px; }
        .logout-btn {
            background: #475569;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .refresh-btn {
            background: #059669;
            margin-left: 10px;
        }
        .filter-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
<div class="admin-container">
    <div id="loginPanel" class="login-box">
        <h2>Givy Admin</h2>
        <div id="loginError" style="display:none;" class="error-msg"></div>
        <input type="email" id="adminEmail" placeholder="Admin Email" value="givyrewards@proton.me">
        <input type="password" id="adminPassword" placeholder="Password">
        <button onclick="adminLogin()">Login as Admin</button>
    </div>
    <div id="adminPanel" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>📦 Givy Orders Manager</h1>
            <div>
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
                <button class="logout-btn refresh-btn" onclick="loadOrders()">🔄 Refresh</button>
            </div>
        </div>
        <div class="filter-bar">
            <input type="text" id="filterId" placeholder="Filter by Order ID" style="background:#0f1117; border:1px solid #475569; color:white; padding:8px; border-radius:8px;">
            <input type="text" id="filterEmail" placeholder="Filter by Email" style="background:#0f1117; border:1px solid #475569; color:white; padding:8px; border-radius:8px;">
            <select id="filterStatus" style="background:#0f1117; border:1px solid #475569; color:white; padding:8px; border-radius:8px;">
                <option value="">All statuses</option>
                <option value="pending">pending</option>
                <option value="confirmed_intent">confirmed_intent</option>
                <option value="rejected">rejected</option>
            </select>
            <button onclick="applyFilters()" style="background:#f59e0b; border:none; padding:8px 16px; border-radius:8px; font-weight:bold;">Filter</button>
        </div>
        <div style="overflow-x: auto;">
            <table id="ordersTable">
                <thead>
                    <tr><th>Order ID</th><th>User</th><th>Item</th><th>Condition</th><th>Location</th><th>Pickup Date/Time</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="ordersBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAzSh_wSb6hdZtq3HULcNnyZmT8HbA1CRU",
        authDomain: "givy-rewards-7e086.firebaseapp.com",
        projectId: "givy-rewards-7e086",
        storageBucket: "givy-rewards-7e086.firebasestorage.app",
        messagingSenderId: "279968070839",
        appId: "1:279968070839:web:8761241835b0ee273da132"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let adminAuthenticated = false;

    window.adminLogin = async function() {
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value.trim();
        const errorDiv = document.getElementById('loginError');
        errorDiv.style.display = 'none';

        // Жёстко заданные учётные данные для админа (можно изменить на свои)
        const ADMIN_EMAIL = "givyrewards@proton.me";
        const ADMIN_PASSWORD = "your_admin_password_here";  // ⚠️ ЗАМЕНИТЕ НА РЕАЛЬНЫЙ ПАРОЛЬ

        if (email !== ADMIN_EMAIL || password !== ADMIN_PASSWORD) {
            errorDiv.textContent = "Access denied: only admin can access this page";
            errorDiv.style.display = 'block';
            return;
        }

        // Дополнительно можно аутентифицироваться через Firebase (необязательно)
        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch(e) { console.log("Firebase auth error (ignored):", e); }

        adminAuthenticated = true;
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadOrders();
    };

    window.logout = function() {
        adminAuthenticated = false;
        document.getElementById('loginPanel').style.display = 'block';
        document.getElementById('adminPanel').style.display = 'none';
        if (auth) auth.signOut();
    };

    async function loadOrders() {
        if (!adminAuthenticated) return;
        const ordersRef = collection(db, 'orders');
        const q = query(ordersRef, orderBy('createdAt', 'desc'));
        const snapshot = await getDocs(q);
        const orders = [];
        snapshot.forEach(docSnap => {
            orders.push({ id: docSnap.id, ...docSnap.data() });
        });
        window.ordersData = orders;
        renderOrders(orders);
    }

    function renderOrders(orders) {
        const tbody = document.getElementById('ordersBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        orders.forEach(order => {
            const isGuest = order.isGuest === true;
            const row = tbody.insertRow();
            row.insertCell(0).textContent = order.id.substring(0, 8) + '…';
            row.insertCell(1).innerHTML = (isGuest ? '<span class="guest-badge">👤 GUEST</span> ' : '👤 ') + (order.nickname || order.userEmail || 'Guest');
            row.insertCell(2).textContent = order.title || '-';
            row.insertCell(3).textContent = order.condition || '-';
            const loc = order.location || {};
            const locText = loc.city ? `${loc.city}, ${loc.state} ${loc.zip}` : (order.zip || 'Not provided');
            row.insertCell(4).textContent = locText;
            row.insertCell(5).textContent = `${order.date || ''} ${order.time || ''}`.trim() || '-';
            const statusCell = row.insertCell(6);
            const currentStatus = order.status || 'pending';
            statusCell.innerHTML = `<select class="status-select" data-id="${order.id}" data-status="${currentStatus}">
                <option value="pending" ${currentStatus === 'pending' ? 'selected' : ''}>pending</option>
                <option value="confirmed_intent" ${currentStatus === 'confirmed_intent' ? 'selected' : ''}>confirmed_intent</option>
                <option value="rejected" ${currentStatus === 'rejected' ? 'selected' : ''}>rejected</option>
                ${!isGuest ? '<option value="picked_up" ' + (currentStatus === 'picked_up' ? 'selected' : '') + '>picked_up</option>' : ''}
            </select>`;
            const actionsCell = row.insertCell(7);
            actionsCell.innerHTML = `<button class="status-btn confirm" onclick="updateStatus('${order.id}', 'confirmed_intent')">✅ Confirm Intent</button>
                                     <button class="status-btn reject" onclick="updateStatus('${order.id}', 'rejected')">❌ Reject</button>`;
            if (!isGuest && currentStatus !== 'picked_up') {
                actionsCell.innerHTML += `<button class="status-btn" style="background:#2563eb;" onclick="updateStatus('${order.id}', 'picked_up')">📦 Picked Up</button>`;
            }
        });

        // Добавляем обработчики для выпадающих списков
        document.querySelectorAll('.status-select').forEach(select => {
            select.addEventListener('change', (e) => {
                const orderId = select.dataset.id;
                const newStatus = select.value;
                updateStatus(orderId, newStatus);
            });
        });
    }

    window.updateStatus = async function(orderId, newStatus) {
        if (!confirm(`Change status to "${newStatus}"?`)) return;
        try {
            const orderRef = doc(db, 'orders', orderId);
            await updateDoc(orderRef, { status: newStatus });
            alert(`Status updated to ${newStatus}`);
            loadOrders(); // перезагрузить таблицу
        } catch(e) {
            console.error(e);
            alert('Error updating status: ' + e.message);
        }
    };

    window.applyFilters = function() {
        if (!window.ordersData) return;
        const filterId = document.getElementById('filterId').value.toLowerCase();
        const filterEmail = document.getElementById('filterEmail').value.toLowerCase();
        const filterStatus = document.getElementById('filterStatus').value;
        let filtered = window.ordersData.filter(order => {
            if (filterId && !order.id.toLowerCase().includes(filterId)) return false;
            if (filterEmail && !(order.userEmail || '').toLowerCase().includes(filterEmail) && !(order.email || '').toLowerCase().includes(filterEmail)) return false;
            if (filterStatus && order.status !== filterStatus) return false;
            return true;
        });
        renderOrders(filtered);
    };

    // Если уже авторизован через Firebase Auth, можно пропустить логин
    onAuthStateChanged(auth, (user) => {
        if (user && user.email === "givyrewards@proton.me") {
            adminAuthenticated = true;
            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadOrders();
        }
    });
</script>
</body>
</html>
