<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GivyRewardsShop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A0A0A; font-family: Arial, sans-serif; color: #EDEDED; padding: 20px; }
    h1 { text-align: center; margin-bottom: 10px; color: #FFFFFF; padding-top: 8px; }
    h1 .shop-accent { color: #C5A267; }
    h1 .logo-float { display: inline-block; animation: floaty 3s ease-in-out infinite; transform-origin: center; }
    @keyframes floaty {
      0%   { transform: translateY(0)    rotate(0deg);  }
      25%  { transform: translateY(-6px) rotate(-3deg); }
      50%  { transform: translateY(0)    rotate(0deg);  }
      75%  { transform: translateY(-6px) rotate(3deg);  }
      100% { transform: translateY(0)    rotate(0deg);  }
    }

/* ── Кнопка назад — ярче ── */
.back-to-givy {
position: fixed; top: 16px; left: 16px;
background: #ffffff;
color: #000000;
padding: 10px 18px; border-radius: 999px;
text-decoration: none; font-size: 14px; font-weight: 800;
display: inline-flex; align-items: center; gap: 6px;
box-shadow: 0 4px 16px rgba(255,255,255,0.25);
z-index: 100; transition: transform 0.15s, box-shadow 0.15s;
}
.back-to-givy:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,255,255,0.35); }
.back-to-givy:active { transform: scale(0.97); }
@media (max-width: 480px) {
.back-to-givy { padding: 8px 13px; font-size: 12px; }
h1 { padding-top: 40px; }
}

.filters { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 16px; }
.filter-btn { background: #1A1A1A; border: 1px solid #333; padding: 8px 20px; border-radius: 40px; color: white; cursor: pointer; }
.filter-btn.active { background: #C5A267; color: black; }

/* ── Grid: 2 колонки на телефоне, 3 на iPad, 5 на ПК ── */
.product-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 12px;
align-items: stretch;
}
@media (min-width: 768px) {
.product-grid {
grid-template-columns: repeat(3, 1fr);
gap: 20px;
}
}
@media (min-width: 1100px) {
.product-grid {
grid-template-columns: repeat(5, 1fr);
gap: 22px;
}
}

/* Карточка — flex колонка, растягивается по высоте ячейки */
.product-card {
background: #121212;
border-radius: 16px;
overflow: hidden;
transition: transform 0.2s;
display: flex;
flex-direction: column;
height: 100%;          /* занимает всю высоту ячейки грида */
}
.product-card:hover { transform: translateY(-4px); }

/* Фото — фиксированная высота */
.product-img {
position: relative;
width: 100%;
height: 240px;
background: #1E1E1E;
overflow: hidden;
flex-shrink: 0;
touch-action: pan-y;
user-select: none;
cursor: pointer;
}
.carousel-track {
display: flex;
height: 100%;
transition: transform 0.32s cubic-bezier(0.25, 0.46, 0.45, 0.94);
will-change: transform;
}
.carousel-track img {
flex-shrink: 0;
width: 100%;
height: 100%;
object-fit: cover;
pointer-events: none;
-webkit-user-drag: none;
}
.carousel-dots {
position: absolute;
bottom: 10px; left: 0; right: 0;
display: flex; justify-content: center; gap: 6px;
pointer-events: none; z-index: 3;
}
.carousel-dot {
width: 7px; height: 7px; border-radius: 50%;
background: rgba(255,255,255,0.35);
transition: background 0.2s, transform 0.2s;
}
.carousel-dot.active { background: #fff; transform: scale(1.35); }

.img-placeholder { font-size: 60px; display: flex; align-items: center; justify-content: center; height: 100%; }
.sold-badge { position: absolute; bottom: 10px; left: 10px; background: #E41E3F; color: white; font-weight: bold; font-size: 13px; padding: 5px 12px; border-radius: 6px; letter-spacing: 1px; text-transform: uppercase; z-index: 2; }
.sold-card .carousel-track img { filter: grayscale(35%) brightness(0.85); }

/* Тело карточки — flex растягивается, кнопки всегда внизу */
.card-body {
padding: 14px 15px 15px;
display: flex;
flex-direction: column;
flex: 1;               /* занимает всё оставшееся место */
}
.brand  { color: #C5A267; font-size: 12px; margin-bottom: 4px; }
.title  { font-size: 16px; font-weight: bold; margin-bottom: 8px; line-height: 1.3; }

/* Описание — 3 строки, остальное скрыто, кнопка More */
.desc-wrap { margin-bottom: 10px; flex: 1; }
.desc {
color: #999; font-size: 13px; line-height: 1.45;
display: -webkit-box;
-webkit-line-clamp: 3;
-webkit-box-orient: vertical;
overflow: hidden;
}
.desc.expanded {
display: block;
-webkit-line-clamp: unset;
overflow: visible;
}
.desc-toggle {
background: none; border: none; padding: 3px 0 0; margin: 0;
color: #C5A267; font-size: 12px; cursor: pointer;
font-family: inherit; display: block;
}

/* Цена и кнопка */
.price { color: #C5A267; font-size: 20px; font-weight: bold; padding-top: 8px; }
.action-btns { display: flex; justify-content: center; margin-top: 12px; }
.action-btns-top { margin-top: 0; padding: 12px 12px 10px; }
.grab-btn {
background: linear-gradient(135deg, #1877F2, #0d47a1);
border: none;
padding: 11px 22px;
border-radius: 999px;
color: white;
font-weight: 700;
cursor: pointer;
font-size: 13px;
letter-spacing: 0.3px;
display: inline-flex;
align-items: center;
justify-content: center;
gap: 6px;
box-shadow: 0 4px 14px rgba(24,119,242,0.35);
transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
white-space: nowrap;
}
.grab-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(24,119,242,0.5); }
.grab-btn:active { transform: scale(0.97); }
.grab-btn:disabled {
background: #3a3a3a;
box-shadow: none;
opacity: 0.65;
cursor: not-allowed;
}

.admin-icon { position: fixed; bottom: 20px; left: 20px; width: 40px; height: 40px; background: #C5A267; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0.3; cursor: pointer; z-index: 999; }
.empty { text-align: center; padding: 50px; color: #666; }

.lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: 0.2s; }
.lightbox.active { visibility: visible; opacity: 1; }
.lightbox img { max-width: 90%; max-height: 85%; object-fit: contain; user-select: none; }
.lightbox-close { position: absolute; top: 20px; right: 30px; font-size: 40px; cursor: pointer; color: white; user-select: none; }
.lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); border: none; color: white; font-size: 30px; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; user-select: none; }
.lightbox-nav:hover { background: rgba(255,255,255,0.2); }
.lightbox-prev { left: 20px; }
.lightbox-next { right: 20px; }
.lightbox-counter { position: absolute; top: 20px; left: 30px; color: white; font-size: 16px; background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 20px; }
.lightbox-thumbs { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; max-width: 90%; overflow-x: auto; padding: 6px; }
.lightbox-thumb { width: 50px; height: 50px; border-radius: 8px; overflow: hidden; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; }
.lightbox-thumb.active { border-color: #C5A267; }
.lightbox-thumb img { width: 100%; height: 100%; object-fit: cover; }

/* ── Баннер преимуществ — тонкая полоса от края до края ── */
.benefits-banner {
display: block;
width: calc(100% + 40px);
margin: 0 -20px 14px;
overflow: hidden;
background: #f5f7fa;
}
.benefits-banner img {
display: block;
width: 100%;
height: auto;
}
@media (max-width: 767px) {
.benefits-banner {
width: calc(100% + 24px);
margin: 0 -12px 8px;
}
}

/* ── Адаптив для телефона: компактные карточки в 2 колонки ── */
@media (max-width: 767px) {
body { padding: 12px; }
h1 { font-size: 22px; margin-bottom: 6px; }
.product-img { height: 170px; }
.card-body { padding: 10px 11px 11px; }
.brand { font-size: 11px; }
.title { font-size: 14px; margin-bottom: 6px; }
.desc { font-size: 12px; }
.price { font-size: 17px; }
.action-btns { margin-top: 10px; }
.grab-btn { font-size: 12px; padding: 10px 18px; }
}

  </style>
</head>

      projectId: "givy-rewards-7e086",
      storageBucket: "givy-rewards-7e086.firebasestorage.app",
      messagingSenderId: "279968070839",
      appId: "1:279968070839:web:8761241835b0ee273da132"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    let products = [], categories = ['furniture','seating','beds','rugs','decor','office'];
    let activeFilter = 'all', globalFb = '', clickCount = 0;
    let lbImages = [], lbIndex = 0;

    /* ── КАРУСЕЛЬ ── */
    function initCarousel(el) {
      const track = el.querySelector('.carousel-track');
      const dots  = Array.from(el.querySelectorAll('.carousel-dot'));
      if (!track || track.children.length <= 1) return;
      const total = track.children.length;
      let cur = 0, startX = 0, diffX = 0, dragging = false;

      function goTo(idx) {
        cur = (idx + total) % total;
        track.style.transform = 'translateX(-' + (cur * 100) + '%)';
        dots.forEach((d, i) => d.classList.toggle('active', i === cur));
      }
      el.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX; diffX = 0; dragging = true;
        track.style.transition = 'none';
      }, { passive: true });
      el.addEventListener('touchmove', e => {
        if (!dragging) return;
        diffX = e.touches[0].clientX - startX;
        track.style.transform = 'translateX(calc(-' + (cur*100) + '% + ' + diffX + 'px))';
      }, { passive: true });
      el.addEventListener('touchend', () => {
        if (!dragging) return; dragging = false;
        track.style.transition = '';
        if (diffX < -50) goTo(cur+1); else if (diffX > 50) goTo(cur-1); else goTo(cur);
      });
      el.addEventListener('mousedown', e => {
        startX = e.clientX; diffX = 0; dragging = true;
        track.style.transition = 'none'; e.preventDefault();
      });
      window.addEventListener('mousemove', e => {
        if (!dragging) return;
        diffX = e.clientX - startX;
        track.style.transform = 'translateX(calc(-' + (cur*100) + '% + ' + diffX + 'px))';
      });
      window.addEventListener('mouseup', () => {
        if (!dragging) return; dragging = false;
        track.style.transition = '';
        if (diffX < -50) goTo(cur+1); else if (diffX > 50) goTo(cur-1); else goTo(cur);
      });
      goTo(0);
    }

    /* Firebase */
    onSnapshot(query(collection(db,'products'), orderBy('createdAt','desc')), snap => {
      products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderProducts();
    }, () => {
      document.getElementById('products').innerHTML = '<div class="empty">Connection error. Please refresh.</div>';
    });
    onSnapshot(doc(db,'shop_settings','main'), snap => {
      if (snap.exists()) {
        const d = snap.data();
        if (d.categories && d.categories.length) categories = d.categories;
        globalFb = d.globalFb || '';
        renderFilters();
      }
    });

    function renderFilters() {
      const c = document.getElementById('filters');
      c.innerHTML = '';
      const make = (label, val, style) => {
        const b = document.createElement('button');
        b.className = 'filter-btn' + (activeFilter === val ? ' active' : '');
        b.textContent = label;
        if (style) b.style.cssText = style;
        b.onclick = () => setFilter(val, b);
        c.appendChild(b);
      };
      make('All','all');
      categories.forEach(cat => make(cat, cat));
      make('\uD83C\uDFF7\uFE0F Sold','__sold','border-color:#E41E3F;');
    }
    function setFilter(val, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active'); activeFilter = val; renderProducts();
    }

    /* Lightbox */
    function openLightbox(images, idx) {
      if (!images || !images.length) return;
      lbImages = images; lbIndex = idx || 0;
      updateLightbox();
      document.getElementById('lightbox').classList.add('active');
    }
    function updateLightbox() {
      document.getElementById('lightboxImg').src = lbImages[lbIndex];
      document.getElementById('lbCounter').textContent = (lbIndex+1) + ' / ' + lbImages.length;
      const multi = lbImages.length > 1;
      document.querySelector('.lightbox-prev').style.display = multi ? 'block' : 'none';
      document.querySelector('.lightbox-next').style.display = multi ? 'block' : 'none';
      const thumbs = document.getElementById('lbThumbs');
      thumbs.style.display = multi ? 'flex' : 'none';
      if (multi) thumbs.innerHTML = lbImages.map((s,i) =>
        '<div class="lightbox-thumb '+(i===lbIndex?'active':'')+'" onclick="jumpLightbox(event,'+i+')"><img src="'+s+'"></div>'
      ).join('');
    }
    window.navLightbox   = (e,d) => { if(e)e.stopPropagation(); lbIndex=(lbIndex+d+lbImages.length)%lbImages.length; updateLightbox(); };
    window.jumpLightbox  = (e,i) => { if(e)e.stopPropagation(); lbIndex=i; updateLightbox(); };
    window.closeLightbox = ()    => document.getElementById('lightbox').classList.remove('active');
    document.getElementById('lightbox').addEventListener('click', e => { if(e.target.id==='lightbox') closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key==='Escape') closeLightbox();
      else if (e.key==='ArrowLeft')  { lbIndex=(lbIndex-1+lbImages.length)%lbImages.length; updateLightbox(); }
      else if (e.key==='ArrowRight') { lbIndex=(lbIndex+1)%lbImages.length; updateLightbox(); }
    });

    function grabOnFacebook(p) {
      // Приоритет 1: прямая ссылка на пост Marketplace
      if (p.marketplaceUrl && p.marketplaceUrl.trim()) {
        window.open(p.marketplaceUrl.trim(), '_blank');
        return;
      }
      // Приоритет 2 (fallback): Messenger с готовым текстом
      const user = (p.fbUser || globalFb || '').replace(/^@/,'').trim();
      if (user) {
        const msg = 'Hello! I\'m interested in "' + p.name + '" (' + (p.brand||'GIVY STUDIO') + ') - $' + p.price + '. Is it still available?';
        window.open('https://m.me/' + user + '?text=' + encodeURIComponent(msg), '_blank');
        return;
      }
      // Приоритет 3 (последний fallback): поиск по Marketplace
      window.open('https://www.facebook.com/marketplace/search/?query=' + encodeURIComponent((p.name + ' ' + (p.brand||'')).trim()), '_blank');
    }

    /* ── РЕНДЕР ── */
    function renderProducts() {
      const container = document.getElementById('products');
      let list;
      if      (activeFilter==='__sold') list = products.filter(p=>p.sold);
      else if (activeFilter==='all')    list = products.filter(p=>!p.sold);
      else                              list = products.filter(p=>!p.sold && p.category===activeFilter);

      if (!list.length) {
        container.innerHTML = '<div class="empty">'+(activeFilter==='__sold'?'\uD83D\uDCED No sold products yet':'\u2728 No products yet')+'</div>';
        return;
      }
      container.innerHTML = '';

      list.forEach(p => {
        const images = p.images && p.images.length ? p.images : [];
        const isSold = !!p.sold;
        const desc   = (p.desc||'').trim();

        /* фото */
        let imgInner = '';
        if (!images.length) {
          imgInner = '<div class="img-placeholder">\uD83E\uDE91</div>';
        } else {
          imgInner = '<div class="carousel-track">'+
            images.map(s=>'<img src="'+s+'" alt="'+escHtml(p.name)+'" loading="lazy">').join('')+
            '</div>';
          if (images.length > 1) {
            imgInner += '<div class="carousel-dots">'+
              images.map((_,i)=>'<span class="carousel-dot'+(i===0?' active':'')+'"></span>').join('')+
              '</div>';
          }
        }
        if (isSold) imgInner += '<div class="sold-badge">Sold</div>';

        /* описание */
        const needToggle = desc.length > 120;
        const descBlock =
          '<div class="desc-wrap">'+
            '<div class="desc">'+(escHtml(desc)||'Luxury piece')+'</div>'+
            (needToggle ? '<button class="desc-toggle" onclick="toggleDesc(this)">More \u25be</button>' : '')+
          '</div>';

        const card = document.createElement('div');
        card.className = 'product-card'+(isSold?' sold-card':'');
        card.innerHTML =
          '<div class="action-btns action-btns-top">'+
            '<button class="grab-btn"'+(isSold?' disabled':'')+'>'+
              (isSold ? '\uD83C\uDFF7\uFE0F Sold' : '\uD83D\uDED2 Grab on Facebook')+
            '</button>'+
          '</div>'+
          '<div class="product-img">'+imgInner+'</div>'+
          '<div class="card-body">'+
            '<div class="brand">'+escHtml(p.brand||'GIVY STUDIO')+'</div>'+
            '<div class="title">'+escHtml(p.name)+'</div>'+
            descBlock+
            '<div class="price">$'+p.price+'</div>'+
          '</div>';

        /* клик по фото → лайтбокс (только если не свайп) */
        const imgDiv = card.querySelector('.product-img');
        let moved = false;
        imgDiv.addEventListener('touchstart', ()=>{ moved=false; }, { passive:true });
        imgDiv.addEventListener('touchmove',  ()=>{ moved=true;  }, { passive:true });
        imgDiv.addEventListener('touchend',   ()=>{ if(!moved && images.length) openLightbox(images,0); });
        imgDiv.addEventListener('mousedown',  ()=>{ moved=false; });
        imgDiv.addEventListener('mousemove',  ()=>{ moved=true;  });
        imgDiv.addEventListener('mouseup',    ()=>{ if(!moved && images.length) openLightbox(images,0); });

        if (!isSold) card.querySelector('.grab-btn').onclick = ()=>grabOnFacebook(p);

        container.appendChild(card);
        if (images.length > 1) initCarousel(imgDiv);
      });
    }

    window.toggleDesc = function(btn) {
      const desc = btn.previousElementSibling;
      const exp  = desc.classList.toggle('expanded');
      btn.textContent = exp ? 'Less \u25b4' : 'More \u25be';
    };

    document.getElementById('adminIcon').onclick = () => {
      clickCount++;
      setTimeout(()=>clickCount=0, 500);
      if (clickCount>=3) location.href='shop-admin.html';
    };

    function escHtml(s) {
      return s ? String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) : '';
    }

    renderFilters();
  </script>

</body>
</html>
